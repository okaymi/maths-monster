<head>

<title>Maths Monster 數學怪獸 - 主頁</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Comic Sans MS", "Chalkboard SE", "Comic Neue", sans-serif;
    background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
    color: #fff;
    min-height: 100vh;
    padding: 20px;
    text-align: center;
  }
  h1 { color: #ff6b6b; text-shadow: 2px 2px #000; margin-bottom: 10px; }
  .subtitle { opacity: 0.9; margin-bottom: 30px; }
  .monsters {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    margin: 20px 0 40px 0;
  }
  .monster-card {
    background: rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 15px;
    width: 160px;
  }
  .monster-card img {
    width: 130px;
    height: 130px;
    object-fit: contain;
    border-radius: 12px;
  }
  .monster-card p {
    margin: 8px 0 0 0;
    font-weight: bold;
    font-size: 16px;
  }
  .levels {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    max-width: 400px;
    margin: 0 auto;
  }
  .level-btn {
    display: block;
    width: 100%;
    padding: 18px;
    font-size: 20px;
    font-weight: bold;
    border: none;
    border-radius: 15px;
    text-decoration: none;
    color: white;
    box-shadow: 0 4px 0 rgba(0,0,0,0.3);
    transition: transform 0.1s;
  }
  .level-btn:active { transform: translateY(2px); }
  .easy { background: #4ecdc4; }
  .mid { background: #ffe66d; color: #000; }
  .hard { background: #ff6b6b; }
  .note { margin-top: 30px; font-size: 14px; opacity: 0.7; }
</style>
</head>
